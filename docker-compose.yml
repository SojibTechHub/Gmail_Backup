version: '3.8'

services:
  mailvault-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailvault-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000

  mailvault-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailvault-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - mailvault-backend

networks:
  default:
    name: mailvault-network
